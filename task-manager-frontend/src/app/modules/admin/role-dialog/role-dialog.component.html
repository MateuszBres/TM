<h2 mat-dialog-title>Zmień rolę</h2>

<mat-dialog-content>

  <form [formGroup]="form">

    <mat-radio-group
      class="role-group"
      formControlName="role">

      <mat-radio-button value="USER">
        USER
      </mat-radio-button>
      <br>
      <mat-radio-button value="ADMIN">
        ADMIN
      </mat-radio-button>

    </mat-radio-group>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="save()">
    Zapisz
  </button>
</mat-dialog-actions>
