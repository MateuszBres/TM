<mat-card>
  <mat-card-title>Lista Użytkowników</mat-card-title>
<table mat-table [dataSource]="users" class="mat-elevation-z8">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let user"> {{user.id}} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let user"> {{user.email}} </td>
  </ng-container>


  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef> Role </th>
    <td mat-cell *matCellDef="let user"> {{user.role}} </td>
  </ng-container>


  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef> Utworzony </th>
    <td mat-cell *matCellDef="let user"> {{user.createdAt}} </td>
  </ng-container>

   <ng-container matColumnDef="delete">
    <th mat-header-cell *matHeaderCellDef> Usuń </th>
    <td mat-cell *matCellDef="let user">
      <button mat-button color="warn" (click)="deleteUser(user)">Usuń</button>
    </td>
  </ng-container>
  
  <ng-container matColumnDef="edit">
    <th mat-header-cell *matHeaderCellDef> Edytuj </th>
    <td mat-cell *matCellDef="let user">
      <button mat-button color="primary" (click)="editRole(user)">Edytuj</button>
    </td>
  </ng-container>
 

<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns:displayedColumns"></tr>
</table>
</mat-card>
